name: Compilar APK

# Se ejecuta en cada cambio subido y también a mano desde la pestaña Actions
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar la app
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: marcador-padel-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Deja el APK listo para descargar desde el móvil, sin descomprimir nada
      - name: Publicar el APK descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultimo-apk
          name: Último APK
          body: APK más reciente del Marcador de Pádel. Descárgalo desde el móvil e instálalo.
          files: android/app/build/outputs/apk/debug/*.apk
